name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Cancel superseded runs on branches; never cancel a tag (release) run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-appimage
            os: ubuntu-22.04
            bundles: appimage
            artifact: grapi-linux-appimage
            bundle_glob: src-tauri/target/release/bundle/appimage/*.AppImage
          - name: windows-nsis
            os: windows-latest
            bundles: nsis
            artifact: grapi-windows-nsis
            bundle_glob: src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches tauri.conf.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          conf_version="$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])" 2>/dev/null || python -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          if [ "${GITHUB_REF_NAME#v}" != "$conf_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match src-tauri/tauri.conf.json version ${conf_version}" >&2
            exit 1
          fi

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            libfuse2 \
            xdg-utils \
            file

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-build.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Compiling tauri-cli takes minutes; cache the binary. Bump the key suffix
      # to pick up a newer 2.x release.
      - name: Cache tauri-cli
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2-${{ runner.os }}-v1

      - name: Install tauri-cli
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      # beforeBuildCommand (tauri.conf.json) builds the sidecar and the frontend.
      - name: Build desktop bundle
        run: cargo tauri build --bundles ${{ matrix.bundles }}
        env:
          NO_STRIP: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

  release:
    name: draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: grapi-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
