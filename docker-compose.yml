services:
  # ── Backend (FastAPI + SQLite) ──────────────────────────────────────
  backend:
    build:
      # Repo root, so the image can include core/grapi_core next to backend/.
      context: .
      dockerfile: docker/api/Dockerfile
    restart: on-failure
    environment:
      DATABASE_URL: "${DATABASE_URL:-sqlite:////data/db/app.db}"
      METRICS_TTL_DAYS: "${METRICS_TTL_DAYS:-180}"
      GALLERY_TTL_HOURS: "${GALLERY_TTL_HOURS:-24}"
      ECHO_SQL: "${ECHO_SQL:-0}"
      DOWNLOADS_DIR: /data/downloads
      SESSIONS_DIR: /data/sessions
      PYTHONPATH: /app/core
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    ports:
      - "12:8000"
    volumes:
      # Source is bind-mounted for hot reload.
      - ./backend:/app/backend
      - ./core:/app/core
      # Persistent data (sqlite db, sessions, downloads); gitignored.
      - ./data:/data

  # ── Frontend (Next.js dev server) ─────────────────────────────────
  frontend:
    build:
      context: ./docker/web/frontend
      target: build
    command: npm run dev -- -p 3000
    environment:
      NODE_ENV: development
      # Runtime only: the Next rewrite proxies /api/* here.
      BACKEND_URL: http://backend:8000
    ports:
      - "14:3000"
    depends_on:
      - backend
    volumes:
      - ./docker/web/frontend/app:/app/app
      - ./docker/web/frontend/components:/app/components
      - ./docker/web/frontend/lib:/app/lib
