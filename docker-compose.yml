services:
  # ── Backend (FastAPI) ───────────────────────────────────────────────
  backend:
    build: ./docker/api
    restart: on-failure
    environment:
      DATABASE_URL: sqlite:///./data/app.db
      METRICS_TTL_DAYS: "${METRICS_TTL_DAYS:-180}"
      GALLERY_TTL_HOURS: "${GALLERY_TTL_HOURS:-24}"
      DOWNLOADS_DIR: /data/downloads
      SESSIONS_DIR: /data/sessions
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "12:8000"
    volumes:
      - ./docker/api:/app
      - ./docker/api/downloads:/data/downloads
      - ./docker/api/sessions:/data/sessions
    develop:
      watch:
        - action: sync
          path: ./docker/api
          target: /app
          ignore:
            - __pycache__/
            - "*.pyc"
            - downloads/
            - sessions/
            - env/
            - .venv/
        - action: rebuild
          path: ./docker/api/requirements.txt

  # ── Frontend (Next.js dev server) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: build
    command: npm run dev -- -p 3000
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:8000
    ports:
      - "14:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
      - ./frontend/src:/app/src
    develop:
      watch:
        - action: sync
          path: ./frontend/app
          target: /app/app
        - action: sync
          path: ./frontend/components
          target: /app/components
        - action: sync
          path: ./frontend/lib
          target: /app/lib
        - action: rebuild
          path: ./frontend/package.json

volumes:
  pgdata: