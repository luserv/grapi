server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: proxy al backend (FastAPI). El frontend usa rutas relativas /api/*,
    # así que nginx reenvía manteniendo el mismo origen.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Soporte para Server-Sent Events (la app transmite progreso vía SSE):
        # sin buffering y con timeouts largos para no cortar el stream.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # SPA: cualquier ruta desconocida cae en index.html (routing del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
