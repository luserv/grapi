[package]
name = "grapi"
version = "0.1.0"
edition = "2021"

[lib]
name = "grapi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "grapi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
